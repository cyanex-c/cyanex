<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>帮助中心</title></head>
<body>
<div class="help-page">
    <h1>📖 帮助中心</h1>
    <hr>
    <h2>功能介绍</h2>
    <ul>
        <li><strong>登录</strong> — 使用用户名和密码登录系统</li>
        <li><strong>注册</strong> — 新用户注册账号</li>
        <li><strong>搜索</strong> — 搜索其他用户的信息</li>
        <li><strong>个人中心</strong> — 查看和修改个人资料</li>
        <li><strong>充值</strong> — 为账户充值余额</li>
        <li><strong>上传头像</strong> — 上传个人头像图片</li>
    </ul>
    <hr>
    <h2>常见问题</h2>
    <h3>如何修改密码？</h3>
    <p>登录后点击导航栏的"修改密码"，输入当前密码和新密码即可。</p>
    <h3>充值后余额未更新？</h3>
    <p>刷新页面或重新进入个人中心查看最新余额。</p>
    <h3>上传头像支持哪些格式？</h3>
    <p>支持 PNG、JPG、GIF、WEBP、BMP、SVG 格式的图片文件。</p>
    <hr>
    <p class="help-footer">安全版用户管理系统 v2.4 | 如有问题请联系管理员</p>
</div>
</body>
</html>
