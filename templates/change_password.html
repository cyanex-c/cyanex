{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="card">
    <h2>🔑 修改密码</h2>
    {% if error %}<div class="error-msg">⚠️ {{ error }}</div>{% endif %}
    {% if success %}<div class="success-msg">✅ {{ success }}</div>{% endif %}

    <form method="post" action="/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="current_password">当前密码</label>
            <input type="password" id="current_password" name="current_password" placeholder="输入当前密码" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="new_password">新密码</label>
            <input type="password" id="new_password" name="new_password" placeholder="输入新密码（至少8位，含大小写字母+数字+特殊字符）" required minlength="8" autocomplete="new-password" oninput="checkStrength(this.value)">
            <div class="password-strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <small id="strength-text" class="form-hint">密码需包含大小写字母、数字和特殊字符</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">确认新密码</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="再次输入新密码" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn">确认修改</button>
        <a href="/" class="btn btn-secondary">取消</a>
    </form>
</div>

<script>
function checkStrength(p) {
    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');
    let s = 0;
    if (p.length >= 8) s += 25;
    if (/[a-z]/.test(p)) s += 25;
    if (/[A-Z]/.test(p)) s += 25;
    if (/\d/.test(p)) s += 12;
    if (/[@$!%*?&_#]/.test(p)) s += 13;
    fill.style.width = s + '%';
    fill.style.backgroundColor = s < 50 ? '#e74c3c' : s < 75 ? '#f39c12' : '#27ae60';
    text.textContent = s < 50 ? '密码强度：弱' : s < 75 ? '密码强度：中' : '密码强度：强';
}
</script>
{% endblock %}
