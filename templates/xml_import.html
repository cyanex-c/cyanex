{% extends "base.html" %}
{% block title %}XML 数据导入{% endblock %}
{% block content %}
<div class="card xml-card">
    <h2>📄 XML 数据导入</h2>
    <p class="login-desc">粘贴 XML 数据以导入用户信息</p>

    <form method="post" action="/xml-import" class="xml-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="xml_data">XML 数据</label>
            <textarea id="xml_data" name="xml_data" class="xml-textarea" rows="12"
                      placeholder="在此粘贴 XML 数据..."></textarea>
        </div>
        <button type="submit" class="btn btn-login">导入</button>
    </form>

    {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    {% if result_json %}
        <div class="xml-output">
            <div class="xml-output-header">
                <span class="xml-dot"></span>
                <span>解析结果</span>
            </div>
            <pre class="xml-console">{{ result_json }}</pre>
        </div>
    {% endif %}
</div>
{% endblock %}
